<div
  class="login-wrapper"
  [style.background-image]="'url(' + backgroundImages[0] + ')'">
  <div class="login-card">
    <h2>Iniciar Sesión</h2>

    <form (ngSubmit)="login()" novalidate>
      <label for="username">Usuario</label>
      <input
        id="username"
        name="username"
        [value]="username()"
        (input)="username.set($any($event.target).value)"
        required
        autocomplete="username"
        placeholder="ej: admin">

      <label for="password">Contraseña</label>
      <div class="password-field">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          [value]="password()"
          (input)="password.set($any($event.target).value)"
          required
          autocomplete="current-password"
          placeholder="tu contraseña">
        <button
          type="button"
          class="password-toggle"
          (click)="togglePasswordVisibility()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'">
          @if (showPassword()) {
            <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 3l18 18"></path>
              <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"></path>
              <path d="M9.9 5.1A11.7 11.7 0 0 1 12 4.8c5 0 8.8 3.3 10.2 7.2a11.9 11.9 0 0 1-3.1 4.7"></path>
              <path d="M6.6 6.6A11.8 11.8 0 0 0 1.8 12C3.2 15.9 7 19.2 12 19.2c1.5 0 2.9-.3 4.1-.9"></path>
            </svg>
          } @else {
            <svg class="eye-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M1.8 12S5.2 4.8 12 4.8 22.2 12 22.2 12 18.8 19.2 12 19.2 1.8 12 1.8 12Z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          }
        </button>
      </div>

      <button type="submit" class="btn" [disabled]="loading()">
        {{ loading() ? 'Ingresando...' : 'Entrar' }}
      </button>
    </form>

    @if (message()) {
      <p class="message">{{ message() }}</p>
    }
  </div>
</div>
